<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Mini Fight (Best of 3 + Facing Fix)</title>
<style>
  body { margin:0; font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; background:#111; color:#fff; touch-action:none; }
  #ui {
    position:fixed; top:0; left:0; right:0;
    padding:10px; display:flex; gap:10px; align-items:center;
    z-index:10; background:linear-gradient(#111, rgba(17,17,17,.2));
  }
  .side{ flex:1; display:flex; flex-direction:column; gap:6px; }
  .bar { height:14px; background:#333; border-radius:999px; overflow:hidden; }
  .bar > div { height:100%; width:100%; transition: width .08s linear, background .2s; }
  .wins{
    display:flex; gap:6px; align-items:center;
    font-weight:900; font-size:12px; opacity:.9;
  }
  .dot{
    width:10px; height:10px; border-radius:999px;
    background:rgba(255,255,255,.18);
    box-shadow: 0 4px 10px rgba(0,0,0,.35);
  }
  .dot.on{ background:rgba(255,255,255,.92); }
  .label{ letter-spacing:.12em; opacity:.8; }

  #mid{
    min-width:14em;
    text-align:center; font-weight:900; letter-spacing:.5px;
  }
  #msg{ font-size:14px; opacity:.9; }
  #roundHud{ font-size:12px; opacity:.8; letter-spacing:.14em; margin-top:2px; }

  #arena { position:fixed; left:0; right:0; top:66px; bottom:150px; background:radial-gradient(circle at 50% 20%, #222, #0b0b0b 65%); overflow:hidden; }
  #ground { position:absolute; left:0; right:0; bottom:0; height:18px; background:#1f1f1f; box-shadow: 0 -1px 0 rgba(255,255,255,.05) inset; }

  /* ===== オーバーレイ（ROUND/FIGHT/KO/WIN） ===== */
  #overlay{
    position:fixed; inset:0;
    display:none;
    align-items:center; justify-content:center;
    z-index:999;
    pointer-events:none;
    background: radial-gradient(circle at 50% 50%, rgba(0,0,0,.35), rgba(0,0,0,.15) 55%, transparent 75%);
  }
  #overlay.show{ display:flex; }

  /* 赤ドット + 白フチ */
  #winnerText{
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-weight: 900;
    font-size: clamp(46px, 9vw, 96px);
    letter-spacing: .10em;
    text-transform: uppercase;

    background-image: radial-gradient(circle, rgba(255,60,60,.98) 48%, rgba(255,60,60,0) 50%);
    background-size: 8px 8px;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    -webkit-text-stroke: 3px rgba(255,255,255,.95);
    text-shadow:
      0 3px 0 rgba(0,0,0,.25),
      0 10px 28px rgba(0,0,0,.65);

    animation: koBlink .22s steps(1, end) infinite, pop .22s ease-out 1;
  }
  @keyframes koBlink{ 0%,49%{opacity:1} 50%,100%{opacity:.10} }
  #winnerText.win{ animation: winBlink .75s steps(1,end) infinite, pop .22s ease-out 1; }
  @keyframes winBlink{ 0%,49%{opacity:1} 50%,100%{opacity:.12} }
  @keyframes pop{ 0%{transform:scale(.92)} 100%{transform:scale(1)} }

  /* ===== キャラ（CSS人型） ===== */
  .fighter{
    position:absolute; bottom:18px;
    width:64px; height:96px;
    border-radius:18px 18px 14px 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,.35);
    user-select:none;
    will-change:left, bottom, transform, filter;
    transition: filter .06s linear, transform .06s linear;
    overflow: visible;
    transform-origin: 50% 50%;
  }
  #p1 { background:#3498db; }
  #cpu { background:#e74c3c; }

  .fighter::before{
    content:"";
    position:absolute;
    left:50%;
    top:-18px;
    width:42px; height:42px;
    transform: translateX(-50%);
    border-radius:999px;
    background: rgba(255,255,255,.14);
    box-shadow: 0 6px 14px rgba(0,0,0,.25);
  }
  .fighter::after{
    content:"";
    position:absolute;
    left:50%;
    top:18px;
    width:88px; height:74px;
    transform: translateX(-50%);
    pointer-events:none;
    background:
      linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.12)) 0% 18% / 18px 42px no-repeat,
      linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.12)) 100% 18% / 18px 42px no-repeat,
      linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)) 38% 100% / 14px 18px no-repeat,
      linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)) 62% 100% / 14px 18px no-repeat;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.25));
  }

  .name { position:absolute; top:-22px; left:0; right:0; text-align:center; font-size:12px; opacity:.9; font-weight:800; }
  .face{
    position:absolute;
    left:10px; right:10px;
    top:22px;
    height:42px;
    border-radius:14px;
    background: linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,.06));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
  }

  /* ヒットボックス（右側に置く）→ キャラ全体をscaleXで反転すると自然に相手側になる */
  .hitbox{
    position:absolute;
    bottom:26px;
    right:-10px;
    height:18px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
  }
  #p1.punching .hitbox{ width:40px; background:rgba(255,255,255,.28); opacity:1; }
  #p1.kicking  .hitbox{ width:72px; background:rgba(255,255,255,.18); opacity:1; }
  #cpu.punching .hitbox{ width:40px; background:rgba(255,255,255,.28); opacity:1; }
  #cpu.kicking  .hitbox{ width:72px; background:rgba(255,255,255,.18); opacity:1; }

  .guarding{ filter: brightness(.65) saturate(.9); }
  .guarding::before{ background: rgba(255,255,255,.08); }
  .guarding::after{
    background:
      linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.16)) 30% 18% / 18px 42px no-repeat,
      linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.16)) 70% 18% / 18px 42px no-repeat,
      linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)) 38% 100% / 14px 18px no-repeat,
      linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)) 62% 100% / 14px 18px no-repeat;
  }

  .punching::after{
    background:
      linear-gradient(rgba(255,255,255,.20), rgba(255,255,255,.20)) 10% 18% / 24px 36px no-repeat,
      linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.12)) 100% 18% / 18px 42px no-repeat,
      linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)) 38% 100% / 14px 18px no-repeat,
      linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)) 62% 100% / 14px 18px no-repeat;
  }

  .kicking::after{
    background:
      linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.12)) 0% 18% / 18px 42px no-repeat,
      linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.12)) 100% 18% / 18px 42px no-repeat,
      linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)) 38% 100% / 14px 18px no-repeat,
      linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)) 62% 100% / 14px 18px no-repeat,
      linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.28)) 92% 76% / 44px 12px no-repeat,
      radial-gradient(circle, rgba(0,0,0,.30) 0 55%, transparent 56%) 98% 80% / 16px 16px no-repeat;
  }

  .proj{
    position:absolute;
    width:18px; height:18px;
    border-radius:999px;
    background:rgba(120,200,255,.9);
    box-shadow: 0 0 14px rgba(120,200,255,.55);
    will-change:left, bottom;
  }

  #controls{
    position:fixed; left:0; right:0; bottom:0; height:150px;
    display:flex; gap:12px; padding:12px;
    background:linear-gradient(rgba(17,17,17,.2), #111);
    z-index:10;
  }
  .pad { flex:1.2; display:flex; gap:12px; }
  .rightPad { flex:1; display:flex; gap:12px; }
  button{
    flex:1;
    border:0; border-radius:18px;
    background:#2a2a2a; color:#fff;
    font-size:18px; font-weight:900;
    box-shadow: 0 10px 18px rgba(0,0,0,.35);
    -webkit-tap-highlight-color: transparent;
  }
  button:active{ transform: translateY(1px); filter:brightness(1.1); }
  #jump { background:#9b59b6; }
  #down { background:#16a085; }
  #punch { background:#f1c40f; color:#111; }
  #kick { background:#e67e22; }
  #restart { max-width:120px; }
  .tiny { font-size:12px; opacity:.85; font-weight:650; }
</style>
</head>
<body>
  <div id="overlay" aria-hidden="true">
    <div id="winnerText">ROUND 1</div>
  </div>

  <div id="ui">
    <div class="side">
      <div class="bar"><div id="hp1"></div></div>
      <div class="wins">
        <span class="label">YOU</span>
        <span id="p1w1" class="dot"></span>
        <span id="p1w2" class="dot"></span>
      </div>
    </div>

    <div id="mid">
      <div id="msg">READY</div>
      <div id="roundHud">ROUND 1</div>
    </div>

    <div class="side">
      <div class="bar"><div id="hp2"></div></div>
      <div class="wins" style="justify-content:flex-end;">
        <span id="cpuw1" class="dot"></span>
        <span id="cpuw2" class="dot"></span>
        <span class="label">CPU</span>
      </div>
    </div>
  </div>

  <div id="arena">
    <div id="p1" class="fighter">
      <div class="name">YOU</div>
      <div class="face"></div>
      <div class="hitbox"></div>
    </div>
    <div id="cpu" class="fighter">
      <div class="name">CPU</div>
      <div class="face"></div>
      <div class="hitbox"></div>
    </div>
    <div id="ground"></div>
  </div>

  <div id="controls">
    <div class="pad">
      <button id="left">←<div class="tiny">移動/ガード</div></button>
      <button id="down">↓<div class="tiny">コマンド</div></button>
      <button id="right">→<div class="tiny">移動/ガード</div></button>
    </div>

    <div class="rightPad">
      <button id="jump">⬆️<div class="tiny">ジャンプ</div></button>
      <button id="punch">👊<div class="tiny">弱P / 波動</div></button>
      <button id="kick">🦵<div class="tiny">強K</div></button>
      <button id="restart">↻<div class="tiny">再開</div></button>
    </div>
  </div>

<script>
(() => {
  // ======= 調整ポイント =======
  const MAX_HP = 100;
  const MOVE_SPEED = 5;

  const JUMP_V = 14;
  const GRAVITY = 0.75;
  const LAND_LAG_MS = 150;

  const CPU_THINK_MS = 160;

  const GUARD_MULT = 0.33;
  const GUARD_PUSH_MULT = 0.35;
  const GUARD_HITSTOP_MS = 60;

  const ATTACKS = {
    punch: { label:'PUNCH', dmg: 7,  range: 52, activeMs: 90,  recoveryMs: 140, cooldownMs: 220, push: 8 },
    kick:  { label:'KICK',  dmg: 13, range: 78, activeMs: 130, recoveryMs: 260, cooldownMs: 420, push: 12 }
  };

  const HADOU = {
    dmg: 11,
    speed: 7.2,
    y: 46,
    radius: 9,
    cooldownMs: 700,
    recoveryMs: 220,
    inputWindowMs: 1200
  };

  const ROUND_SHOW_MS = 900;
  const FIGHT_SHOW_MS = 600;
  const KO_TO_WIN_MS   = 900;
  const WIN_TO_NEXT_MS = 900;
  // ============================

  const arena = document.getElementById('arena');
  const p1El = document.getElementById('p1');
  const cpuEl = document.getElementById('cpu');
  const hp1El = document.getElementById('hp1');
  const hp2El = document.getElementById('hp2');
  const msgEl = document.getElementById('msg');
  const roundHudEl = document.getElementById('roundHud');

  const overlayEl = document.getElementById('overlay');
  const winnerTextEl = document.getElementById('winnerText');

  const p1w1 = document.getElementById('p1w1');
  const p1w2 = document.getElementById('p1w2');
  const cpuw1 = document.getElementById('cpuw1');
  const cpuw2 = document.getElementById('cpuw2');

  const btnL = document.getElementById('left');
  const btnD = document.getElementById('down');
  const btnR = document.getElementById('right');
  const btnJ = document.getElementById('jump');
  const btnP = document.getElementById('punch');
  const btnK = document.getElementById('kick');
  const btnRe = document.getElementById('restart');

  let winTimer = null;
  let roundTimer = null;

  const match = {
    roundNo: 1,
    p1Wins: 0,
    cpuWins: 0,
    matchOver: false
  };

  const state = {
    running: false,
    p1: {
      x:0, y:0, vy:0,
      lockUntil:0,
      hp:MAX_HP,
      lastAtkAt:{punch:0,kick:0},
      guarding:false,
      lastHadouAt: 0,
      inputSeq: []
    },
    cpu:{
      x:0,
      hp:MAX_HP,
      lastAtkAt:{punch:0,kick:0}
    },
    input:{ left:false, right:false, down:false },
    lastCpuThink: 0,
    projectiles: []
  };

  const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
  const nowMs = ()=>performance.now();
  const setMsg = (t)=>{ msgEl.textContent = t; };

  function roundLabel(n){
    if (n === 3) return 'FINAL ROUND';
    return `ROUND ${n}`;
  }

  // ===== 向き（Facing） =====
  // sign = +1 → 右向き / -1 → 左向き
  function p1FacingSign(){ return (state.cpu.x >= state.p1.x) ? 1 : -1; }
  function cpuFacingSign(){ return (state.p1.x >= state.cpu.x) ? 1 : -1; }

  // 前入力（Forward）は「相手方向」
  function p1ForwardHeld(){
    const s = p1FacingSign();
    return s === 1 ? state.input.right : state.input.left;
  }
  // 後ろ入力（Back）は「相手と逆方向」（ガード用）
  function p1BackHeld(){
    const s = p1FacingSign();
    return s === 1 ? state.input.left : state.input.right;
  }

  function showWinner(text, mode='win'){
    winnerTextEl.textContent = text;
    winnerTextEl.classList.toggle('win', mode === 'win');
    overlayEl.classList.add('show');
    overlayEl.setAttribute('aria-hidden', 'false');
  }
  function hideWinner(){
    overlayEl.classList.remove('show');
    overlayEl.setAttribute('aria-hidden', 'true');
  }
  function clearTimers(){
    if (winTimer) { clearTimeout(winTimer); winTimer = null; }
    if (roundTimer) { clearTimeout(roundTimer); roundTimer = null; }
  }

  function hpColor(hp){
    const r = hp / MAX_HP;
    if (r > 0.6) return '#2ecc71';
    if (r > 0.3) return '#f1c40f';
    return '#e74c3c';
  }

  function updateWinsUI(){
    p1w1.classList.toggle('on', match.p1Wins >= 1);
    p1w2.classList.toggle('on', match.p1Wins >= 2);
    cpuw1.classList.toggle('on', match.cpuWins >= 1);
    cpuw2.classList.toggle('on', match.cpuWins >= 2);
  }

  function updateRoundHUD(){
    roundHudEl.textContent = roundLabel(match.roundNo);
  }

  function distance(){
    return Math.abs((state.p1.x + 32) - (state.cpu.x + 32));
  }

  function layoutInit(){
    const w = arena.clientWidth;
    state.p1.x = w * 0.20;
    state.cpu.x = w * 0.70;
    render();
  }

  function render(){
    // 向きを更新（ここが今回の本丸）
    const p1S = p1FacingSign();
    const cpuS = cpuFacingSign();
    p1El.style.transform = (p1S === 1) ? 'scaleX(1)' : 'scaleX(-1)';
    cpuEl.style.transform = (cpuS === 1) ? 'scaleX(1)' : 'scaleX(-1)';

    p1El.style.left = `${state.p1.x}px`;
    cpuEl.style.left = `${state.cpu.x}px`;

    p1El.style.bottom = `${18 + state.p1.y}px`;
    cpuEl.style.bottom = `18px`;

    hp1El.style.width = `${(state.p1.hp / MAX_HP) * 100}%`;
    hp2El.style.width = `${(state.cpu.hp / MAX_HP) * 100}%`;
    hp1El.style.background = hpColor(state.p1.hp);
    hp2El.style.background = hpColor(state.cpu.hp);

    p1El.classList.toggle('guarding', state.p1.guarding);

    for (const p of state.projectiles) {
      p.el.style.left = `${p.x}px`;
      p.el.style.bottom = `${18 + HADOU.y}px`;
    }
  }

  function cleanupProjectiles(){
    for (const p of state.projectiles) p.el.remove();
    state.projectiles.length = 0;
  }

  function resetRoundState(){
    state.p1.hp = MAX_HP;
    state.cpu.hp = MAX_HP;

    state.p1.y = 0;
    state.p1.vy = 0;
    state.p1.lockUntil = 0;
    state.p1.guarding = false;
    state.p1.lastHadouAt = 0;
    state.p1.inputSeq.length = 0;

    state.p1.lastAtkAt.punch = 0;
    state.p1.lastAtkAt.kick = 0;
    state.cpu.lastAtkAt.punch = 0;
    state.cpu.lastAtkAt.kick = 0;

    state.input.left = false;
    state.input.right = false;
    state.input.down = false;

    cleanupProjectiles();
    layoutInit();
    render();
  }

  function showRoundStart(){
    clearTimers();
    state.running = false;

    updateRoundHUD();
    showWinner(roundLabel(match.roundNo), 'win');
    setMsg(roundLabel(match.roundNo));

    roundTimer = setTimeout(() => {
      showWinner('FIGHT!', 'ko');
      setMsg('FIGHT!');
      roundTimer = setTimeout(() => {
        hideWinner();
        state.running = true;
        setMsg('GO!');
      }, FIGHT_SHOW_MS);
    }, ROUND_SHOW_MS);
  }

  function endMatch(winner){
    match.matchOver = true;
    state.running = false;
    showWinner(`${winner} WIN`, 'win');
    setMsg(`${winner} WIN!`);
  }

  function handleRoundEnd(winner){
    state.running = false;

    showWinner('K.O.', 'ko');
    setMsg('K.O.');

    winTimer = setTimeout(() => {
      showWinner(`${winner} WIN`, 'win');
      setMsg(`${winner} WIN!`);

      if (winner === 'YOU') match.p1Wins++;
      else match.cpuWins++;
      updateWinsUI();

      if (match.p1Wins >= 2) { winTimer = setTimeout(() => endMatch('YOU'), WIN_TO_NEXT_MS); return; }
      if (match.cpuWins >= 2) { winTimer = setTimeout(() => endMatch('CPU'), WIN_TO_NEXT_MS); return; }

      winTimer = setTimeout(() => {
        match.roundNo++;
        resetRoundState();
        showRoundStart();
      }, WIN_TO_NEXT_MS);

    }, KO_TO_WIN_MS);
  }

  function bindTap(btn, fn){
    const handler = (e) => { e.preventDefault?.(); fn(); };
    btn.addEventListener('pointerdown', handler, { passive:false });
    btn.addEventListener('touchstart', handler, { passive:false });
    btn.addEventListener('mousedown', handler);
    btn.addEventListener('click', (e)=>{ e.preventDefault(); fn(); });
  }

  function bindHold(btn, key){
    const on  = (e)=>{ e.preventDefault?.(); state.input[key]=true; onInputKey(key); };
    const off = (e)=>{ e.preventDefault?.(); state.input[key]=false; };
    btn.addEventListener('pointerdown', on, { passive:false });
    btn.addEventListener('touchstart', on, { passive:false });
    btn.addEventListener('mousedown', on);
    btn.addEventListener('pointerup', off);
    btn.addEventListener('pointercancel', off);
    btn.addEventListener('pointerleave', off);
    btn.addEventListener('touchend', off);
    btn.addEventListener('touchcancel', off);
    btn.addEventListener('mouseup', off);
    btn.addEventListener('mouseleave', off);
  }

  function setP1Lock(t, ms){ state.p1.lockUntil = Math.max(state.p1.lockUntil, t + ms); }
  function canUseAttack(who, type, t){ return (t - who.lastAtkAt[type]) >= ATTACKS[type].cooldownMs; }

  function showAttackAnim(el, type, ms){
    el.classList.remove('punching','kicking');
    el.classList.add(type === 'punch' ? 'punching' : 'kicking');
    setTimeout(()=>el.classList.remove('punching','kicking'), ms);
  }

  // ガード（後ろ入力）
  function isP1GuardInput(){
    if (state.p1.y > 0) return false;
    return !!p1BackHeld();
  }

  function doJump(){
    const t = nowMs();
    if (!state.running || match.matchOver) return;
    if (t < state.p1.lockUntil) return;
    if (state.p1.y === 0) { state.p1.vy = JUMP_V; setMsg('JUMP!'); }
  }

  function onInputKey(key){
    const t = nowMs();
    const k = (key === 'down') ? 'D' : (key === 'right' ? 'R' : (key === 'left' ? 'L' : '?'));
    if (k === 'D' || k === 'R' || k === 'L') {
      state.p1.inputSeq.push({k, t});
      state.p1.inputSeq = state.p1.inputSeq.filter(x => (t - x.t) <= HADOU.inputWindowMs);
    }
  }

  // 波動コマンド：下＋前（向きで前が変わる）
  function hadouCommandReady(){
    const t = nowMs();
    state.p1.inputSeq = state.p1.inputSeq.filter(x => (t - x.t) <= HADOU.inputWindowMs);
    const recentDown = state.p1.inputSeq.some(x => x.k === 'D');
    return recentDown && !!p1ForwardHeld();
  }
  function clearHadouSeq(){ state.p1.inputSeq.length = 0; }

  function spawnHadouken(){
    const t = nowMs();
    if (!state.running || match.matchOver) return;
    if (state.p1.y > 0) { setMsg('AIR'); return; }
    if (t < state.p1.lockUntil) return;
    if ((t - state.p1.lastHadouAt) < HADOU.cooldownMs) return;

    state.p1.lastHadouAt = t;
    setP1Lock(t, HADOU.recoveryMs);

    const s = p1FacingSign();
    const el = document.createElement('div');
    el.className = 'proj';
    arena.appendChild(el);

    // 生成位置＆飛ぶ方向を向きで切替
    const startX = (s === 1) ? (state.p1.x + 64) : (state.p1.x - 18);
    const vx = HADOU.speed * s;

    state.projectiles.push({ x: startX, vx, el });

    setMsg('HADOUKEN!');
    clearHadouSeq();
  }

  function doAttackP1(type){
    const t = nowMs();
    if (!state.running || match.matchOver) return;
    if (state.p1.y > 0) { setMsg('AIR'); return; }
    if (t < state.p1.lockUntil) return;

    if (type === 'punch' && hadouCommandReady()) {
      showAttackAnim(p1El, 'punch', 120);
      spawnHadouken();
      render();
      return;
    }

    if (!canUseAttack(state.p1, type, t)) return;

    const spec = ATTACKS[type];
    state.p1.lastAtkAt[type] = t;

    showAttackAnim(p1El, type, spec.activeMs);
    setP1Lock(t, spec.recoveryMs);

    if (distance() <= spec.range) {
      state.cpu.hp = clamp(state.cpu.hp - spec.dmg, 0, MAX_HP);
      setMsg(`${spec.label}! HIT`);

      // ノックバック：相手から離れる方向へ
      const dir = (state.cpu.x >= state.p1.x) ? 1 : -1;
      state.cpu.x = clamp(state.cpu.x + dir * spec.push, 0, arena.clientWidth - 64);

      if (state.cpu.hp <= 0) handleRoundEnd('YOU');
    } else {
      setMsg(`${spec.label}! MISS`);
    }

    render();
  }

  function applyHitToP1(dmg, push){
    const t = nowMs();
    const guarding = state.p1.guarding && isP1GuardInput();

    // push方向：CPUから離れる方向へ
    const dir = (state.p1.x >= state.cpu.x) ? 1 : -1;

    if (guarding) {
      const gdmg = Math.max(1, Math.floor(dmg * GUARD_MULT));
      state.p1.hp = clamp(state.p1.hp - gdmg, 0, MAX_HP);
      setMsg('GUARD!');
      const gpush = Math.round(push * GUARD_PUSH_MULT);
      state.p1.x = clamp(state.p1.x + dir * gpush, 0, arena.clientWidth - 64);
      setP1Lock(t, GUARD_HITSTOP_MS);
      return;
    }

    state.p1.hp = clamp(state.p1.hp - dmg, 0, MAX_HP);
    setMsg('HIT!');
    state.p1.x = clamp(state.p1.x + dir * push, 0, arena.clientWidth - 64);
    setP1Lock(t, 90);

    if (state.p1.hp <= 0) handleRoundEnd('CPU');
  }

  function doAttackCPU(type){
    const t = nowMs();
    if (!state.running || match.matchOver) return;
    if (!canUseAttack(state.cpu, type, t)) return;

    const spec = ATTACKS[type];
    state.cpu.lastAtkAt[type] = t;

    showAttackAnim(cpuEl, type, spec.activeMs);

    if (distance() <= spec.range) applyHitToP1(spec.dmg, spec.push);
    else setMsg(`CPU ${spec.label} MISS`);

    render();
  }

  function cpuThink(){
    const d = distance();
    const toward = (state.p1.x > state.cpu.x) ? 1 : -1;

    if (d > 120) state.cpu.x += toward * MOVE_SPEED * 0.85;
    else {
      const r = Math.random();
      if (d <= ATTACKS.kick.range && r < 0.55) doAttackCPU('kick');
      else doAttackCPU('punch');
      if (Math.random() < 0.22) state.cpu.x -= toward * MOVE_SPEED * 0.7;
    }
    state.cpu.x = clamp(state.cpu.x, 0, arena.clientWidth - 64);
  }

  function updateProjectiles(){
    const w = arena.clientWidth;

    for (let i = state.projectiles.length - 1; i >= 0; i--) {
      const p = state.projectiles[i];
      p.x += p.vx;

      const px = p.x + HADOU.radius;
      const cx = state.cpu.x + 32;
      const hit = Math.abs(px - cx) <= (HADOU.radius + 20);

      if (hit) {
        state.cpu.hp = clamp(state.cpu.hp - HADOU.dmg, 0, MAX_HP);
        setMsg('HADOU HIT!');

        // 波動のノックバックも相手から離れる方向へ
        const dir = (state.cpu.x >= state.p1.x) ? 1 : -1;
        state.cpu.x = clamp(state.cpu.x + dir * 10, 0, w - 64);

        p.el.remove();
        state.projectiles.splice(i, 1);

        if (state.cpu.hp <= 0) handleRoundEnd('YOU');
        continue;
      }

      if (p.x < -60 || p.x > w + 60) {
        p.el.remove();
        state.projectiles.splice(i, 1);
      }
    }
  }

  function resetMatch(){
    clearTimers();

    match.roundNo = 1;
    match.p1Wins = 0;
    match.cpuWins = 0;
    match.matchOver = false;
    updateWinsUI();
    updateRoundHUD();

    hideWinner();
    resetRoundState();
    showRoundStart();
  }

  // 入力
  bindHold(btnL, 'left');
  bindHold(btnD, 'down');
  bindHold(btnR, 'right');

  bindTap(btnJ, () => doJump());
  bindTap(btnP, () => doAttackP1('punch'));
  bindTap(btnK, () => doAttackP1('kick'));
  bindTap(btnRe, () => resetMatch());

  function tick(t){
    if (state.running && !match.matchOver) {
      state.p1.guarding = isP1GuardInput();

      // ジャンプ物理
      if (state.p1.y > 0 || state.p1.vy > 0) {
        state.p1.y += state.p1.vy;
        state.p1.vy -= GRAVITY;
        if (state.p1.y <= 0) {
          state.p1.y = 0;
          state.p1.vy = 0;
          setP1Lock(t, LAND_LAG_MS);
          setMsg('LAND');
        }
      }

      // 移動（硬直中は不可）
      if (t >= state.p1.lockUntil) {
        if (state.input.left)  state.p1.x -= MOVE_SPEED;
        if (state.input.right) state.p1.x += MOVE_SPEED;
      }
      state.p1.x = clamp(state.p1.x, 0, arena.clientWidth - 64);

      updateProjectiles();

      // CPU
      if (t - state.lastCpuThink > CPU_THINK_MS) {
        state.lastCpuThink = t;
        cpuThink();
      }
    }

    render();
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', layoutInit);

  // 起動
  updateWinsUI();
  updateRoundHUD();
  layoutInit();
  showRoundStart();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
